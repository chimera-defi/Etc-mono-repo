name: PR Attribution Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-attribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-attribution:
    name: Check PR Attribution
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check PR Description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || '';
            const body = pr.body || '';
            const errors = [];
            const warnings = [];

            if (!/^\*\*Human author:\*\*\s+Chimera\s+<chimera_defi@protonmail\.com>/im.test(body)) {
              errors.push('❌ PR description must include `**Human author:** Chimera <chimera_defi@protonmail.com>`.');
            }
            if (!/^\*\*Agent:\*\*\s+.+/im.test(body)) {
              errors.push('❌ PR description must include `**Agent:** <actual model name>`.');
            }
            if (!/^\*\*AI co-authors?:\*\*\s+.+/im.test(body)) {
              errors.push('❌ PR description must include `**AI co-authors:**` for material AI participants.');
            }
            if (!/##\s*Original\s*Request/i.test(body)) {
              errors.push('❌ PR description must include `## Original Request`.');
            }
            if (!/##\s*Summary/i.test(body) || !/##\s*(Testing|Verification|Testing\s*&\s*Verification)/i.test(body)) {
              errors.push('❌ PR description must include Summary and Verification/Testing sections.');
            }

            const badTitlePatterns = [/user\s+asked/i, /as\s+requested/i, /implement\s+.*\s+as\s+requested/i, /add\s+.*\s+as\s+requested/i];
            if (badTitlePatterns.some((pattern) => pattern.test(title))) {
              warnings.push('⚠️ PR title appears to describe the prompt rather than the completed change.');
            }

            if (errors.length > 0 || warnings.length > 0) {
              let comment = '## PR Attribution Check\n\n';
              if (errors.length) {
                comment += '### ❌ Required Fixes\n' + errors.map((e) => `- ${e}`).join('\n') + '\n\n';
              }
              if (warnings.length) {
                comment += '### ⚠️ Suggestions\n' + warnings.map((e) => `- ${e}`).join('\n') + '\n\n';
              }
              comment += 'See `AGENTS.md` for the current human-primary attribution contract.\n';

              const issue_number = pr.number;
              const { owner, repo } = context.repo;
              const { data: comments } = await github.rest.issues.listComments({ issue_number, owner, repo, per_page: 100 });
              const prior = comments.find((c) => c.user && c.user.type === 'Bot' && typeof c.body === 'string' && c.body.startsWith('## PR Attribution Check'));
              if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body: comment });
              else await github.rest.issues.createComment({ issue_number, owner, repo, body: comment });
              if (errors.length) core.setFailed('PR attribution check failed. See PR comment for details.');
            } else {
              core.info('PR attribution check passed.');
            }
